<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MOSS - AI 工作台" />
    <meta name="theme-color" content="#18181b" />
    <link rel="icon" type="image/png" href="/MOSS.png" />
    <title>MOSS</title>
  </head>
  <body>
    <div id="root">
      <!-- 启动加载骨架：主 bundle 加载期间可见（React createRoot().render() 后自动替换）。
           内联样式，不依赖外部 CSS/CSS 变量——首字节即渲染，弱网下消除纯白屏。 -->
      <div id="moss-boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#09090b;color:#e4e4e7;font-family:system-ui,sans-serif;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="display:inline-block;width:22px;height:22px;border:2px solid #3f3f46;border-top-color:#e4e4e7;border-radius:50%;animation:moss-spin .8s linear infinite;"></span>
          <span style="font-size:15px;font-weight:600;letter-spacing:0.5px;">MOSS</span>
        </div>
        <span style="font-size:12px;color:#a1a1aa;">正在加载 / Loading…</span>
      </div>
      <style>
        @keyframes moss-spin {
          to { transform: rotate(360deg); }
        }
        @media (prefers-color-scheme: light) {
          #moss-boot { background: #ffffff; color: #18181b; }
          #moss-boot span:last-child { color: #52525b; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
